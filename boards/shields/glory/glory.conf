# Uncomment the following lines to enable the Glory RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Glory OLED Display
# CONFIG_ZMK_DISPLAY=y

# Pointing subsystem. Needed on both halves for the PMW3610 trackball: the
# central runs the input-listener (HID mouse), the peripheral runs the
# input-split sender. The actual driver is enabled per-half in glory_right.conf.
CONFIG_ZMK_POINTING=y
