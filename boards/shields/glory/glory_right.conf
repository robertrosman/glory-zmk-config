# PMW3610 trackball driver (badjeff/zmk-pmw3610-driver, "pixart,pmw3610-alt").
# Only the right half physically has the sensor, so the driver is enabled here.
# CONFIG_ZMK_POINTING is set in the shared glory.conf.
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3610_ALT=y

# nice_nano_v2 powers the sensor from a GPIO-switched rail, which needs a moment
# to come up. Without this you may see "Incorrect product id 0xFF" at boot.
CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=1000

# Optional tuning:
# CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12   # slow reports for smoother BLE

# Driver debug logging (temporary — comment out once the trackball works).
CONFIG_PMW3610_ALT_LOG_LEVEL_DBG=y
